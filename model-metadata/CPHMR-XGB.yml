methods_long: "An XGBoost gradient-boosted decision tree forecasting model trained using historical COVID-19 hospital admission observations and engineered temporal features. The model generates probabilistic forecasts for weekly COVID-19 hospital admissions across forecast horizons 0 through 3 weeks ahead. Quantile forecasts are generated at the required prediction levels and constrained to be non-negative."

